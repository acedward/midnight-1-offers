# The Shielded NIGHT dApp, served on container :10900 (compose publishes it on
# ${SHIELDED_NIGHT_HOST_PORT}).
#
# There is deliberately no `types { … }` block here. The stock /etc/nginx/mime.types already
# maps application/wasm, and a second `types` block in the same context is a configuration
# error rather than a merge — the Dockerfile asserts the mapping exists instead, so a base
# image that ever dropped it fails the BUILD rather than serving wasm as octet-stream and
# breaking streaming instantiation at run time.
server {
    listen 10900;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /config.js is written at container start and carries THIS stack's contract address.
    # `location = …` so it never reaches the SPA fallback below: a missing file must be a real
    # 404 the healthcheck fails on, not a 200 of index.html that looks fine and leaves the page
    # with no network to select. Never cached — the address changes with every `./down.sh -v`.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # THE ZK ARTIFACT LANE, and the reason it is not simply left to the SPA fallback.
    #
    # midnight-js's FetchZkConfigProvider fetches keys/<circuit>.prover, keys/<circuit>.verifier
    # and zkir/<circuit>.bzkir from here and only checks `response.ok`. Under the fallback a
    # typo or a missing artifact would answer 200 with the HTML app shell, and the prover would
    # be handed an HTML document as a proving key — a failure that surfaces deep inside proving
    # with an error naming none of this. `try_files $uri =404` makes a miss a miss.
    #
    # THREE PATHS, because upstream #14 MOVED the one the page uses. Since that PR the adapter
    # resolves its base as `<page origin>/contract/<profile>/shielded-night`
    # (frontend/protocols/shared/asset-url.ts), so the LIVE path on this stack is
    # `/contract/v1/…` — `undeployed` is the `midnight-1.x` family in upstream's own network
    # table. `/contract/v2/…` is emitted by the same vite copy plugin and served for
    # completeness; nothing on this stack can select it. `/contract/compiled/…` is the pre-#14
    # path, which upstream still emits for clients left open across a rollout.
    #
    # A REGEX LOCATION rather than three prefix blocks: they take identical directives, and a
    # `location ~` matches before any prefix location can, so the SPA fallback below cannot
    # capture a miss under any of the three. The alternation is anchored and closed, so an
    # unknown fourth profile segment is NOT covered — it would fall through to the fallback, and
    # the image's dist assertions plus scripts/verify-shielded-night.sh are what catch a re-pin
    # that introduces one.
    #
    # These files have no mime mapping on purpose: they fall through to the http block's
    # `default_type application/octet-stream` (asserted in the Dockerfile), which is what the
    # verify script checks for. The .wasm alongside them still gets application/wasm from
    # mime.types.
    location ~ ^/contract/(v1|v2|compiled)/ {
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
