# The mint-test-tokens faucet site, served on container :10500 (compose publishes it on
# ${FAUCET_HOST_PORT}). Open it at  http://127.0.0.1:${FAUCET_HOST_PORT}/?network=undeployed
#
# ── THIS FILE IS A TRANSCRIPTION OF frontend/public/_headers, AND THAT IS PINNED ─
# Upstream's site is a Cloudflare Pages deployment: its header policy lives in
# `frontend/public/_headers`, which Pages reads and nginx does not. So the policy is restated
# here — and `images/issuer/Dockerfile` pins that file BY SHA-256, so a re-pin that changes the
# policy fails the BUILD and names this file, instead of silently leaving nginx describing a
# policy upstream no longer has.
#
# The rules, verbatim from that file, and where each one lands below:
#
#   /metadata.*.json   ACAO *, ACAM "GET, HEAD, OPTIONS",
#                      Cache-Control "public, max-age=300, must-revalidate",
#                      Content-Type "application/json; charset=utf-8"
#   /contract/*        ACAO *, Cache-Control "public, max-age=3600, must-revalidate"
#   /*                 Referrer-Policy strict-origin-when-cross-origin,
#                      X-Content-Type-Options nosniff, X-Frame-Options DENY,
#                      Permissions-Policy "camera=(), microphone=(), geolocation=()"
#   / and /index.html and /404.html and /favicon.svg
#                      Cache-Control "public, max-age=0, must-revalidate"
#   /assets/*          Cache-Control "public, max-age=31536000, immutable"
#
# `add_header … always` everywhere, because without `always` nginx drops the header on a 4xx —
# and a 404 for `/metadata.undeployed.json` is the NORMAL state of a stack whose issuer has not
# deployed yet, which the SPA reads as "unavailable". A CORS-less 404 would present to a
# cross-origin reader as a network error instead.
#
# There is deliberately no `types { … }` block: the stock /etc/nginx/mime.types already maps
# application/wasm, and a second `types` block in the same context is a configuration error
# rather than a merge. The Dockerfile asserts the mapping exists instead.
server {
    listen 10500;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # THE CHARSET IS SET WITH `charset`, NOT WITH `add_header Content-Type`. nginx's
    # `add_header` APPENDS: a second Content-Type would be emitted alongside the one
    # mime.types already produced, and the SPA's own guard reads
    # `response.headers.get('content-type')`, which for duplicates returns them comma-joined.
    # `charset` + `charset_types` is the directive that actually rewrites the value, and
    # `application/json; charset=utf-8` is exactly what upstream's `_headers` states for the
    # registry files. (The stock mime.types already maps `.json` to application/json, so the
    # type itself is not restated anywhere.)
    charset utf-8;
    charset_types application/json application/javascript text/css text/plain image/svg+xml;

    # nginx's own default is off; the ZK artifacts are large and every byte of them crosses the
    # loopback interface to a browser on this host.
    gzip on;
    gzip_types application/json application/javascript text/css text/html image/svg+xml;
    # Never gzip the proving keys: they are already incompressible and doing so costs CPU on
    # every page load for nothing.
    gzip_min_length 1024;

    # ── THE ONE FILE THAT IS NOT IN THE IMAGE ─────────────────────────────────
    # `metadata.undeployed.json` is published by THIS STACK's issuer-deploy one-shot onto the
    # `issuer-registry` volume; the image deliberately carries no copy (the Dockerfile asserts
    # `dist` has none), because a baked one would be served in preference to nothing at all and
    # would name six contracts that do not exist on this chain.
    #
    # `alias` to the volume, and `location =` so it never reaches the SPA fallback below: a
    # missing registry must be a real 404 — which `localMetadataAvailable()` and
    # `fetchRegistry()` in the SPA both handle as "unavailable" — and not a 200 of index.html,
    # which `fetchRegistry` would reject as "Expected JSON metadata but received text/html".
    #
    # NO CACHING beyond the upstream policy's 300 s: the file is REPLACED BY RENAME (a new
    # inode) on every redeploy, and nginx's open_file_cache is off by default, so each request
    # resolves the path again. That is exactly what upstream's own instruction requires ("have
    # each service reopen metadata.undeployed.json by path for every read").
    location = /metadata.undeployed.json {
        alias /srv/issuer-registry/metadata.undeployed.json;

        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Cache-Control 'public, max-age=300, must-revalidate' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;

        # The SPA sends a preflight-free simple GET, but the policy advertises OPTIONS, so
        # answer it rather than let it fall through to a 405. One of the two uses of `if` that
        # is documented as safe in a location (`return`).
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # The three TRACKED public registries, which vite copies into `dist`. Same policy; they are
    # read-only curiosities on a local stack (the site can show Preview/Preprod/Stagenet), and
    # they are served from the image rather than the volume.
    location ~ ^/metadata\.(preview|preprod|stagenet)\.json$ {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Cache-Control 'public, max-age=300, must-revalidate' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        try_files $uri =404;
    }

    # ── THE ZK ARTIFACT LANE, and why it is not left to the SPA fallback ──────
    # midnight-js's FetchZkConfigProvider fetches keys/<circuit>.prover, keys/<circuit>.verifier
    # and zkir/<circuit>.bzkir from here and only checks `response.ok`. Under the fallback a
    # typo or a missing artifact would answer 200 with the HTML app shell, and the prover would
    # be handed an HTML document as a proving key — a failure that surfaces deep inside proving
    # with an error naming none of this. `try_files $uri =404` makes a miss a miss.
    #
    # These files have no mime mapping on purpose: they fall through to the http block's
    # `default_type application/octet-stream` (asserted in the Dockerfile). The .wasm alongside
    # them still gets application/wasm from mime.types.
    location /contract/ {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Cache-Control 'public, max-age=3600, must-revalidate' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        try_files $uri =404;
    }

    # Content-hashed bundles: immutable for a year, which is upstream's own policy and is safe
    # precisely because the names carry the hash.
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to the app shell, uncached, because the shell
    # names the content-hashed bundle it needs.
    location / {
        add_header Cache-Control 'public, max-age=0, must-revalidate' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        try_files $uri $uri/ /index.html;
    }
}
