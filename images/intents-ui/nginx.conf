# nginx.conf — serve the intents SPA and BE ITS EDGE.
#
# Written for this deployment; it is not a copy of anything upstream. Two jobs:
#
#   1. serve the built single-page app, with SPA-style fallback so a deep link works;
#   2. proxy the relay's public API under `/api/v1/`, stripping that prefix.
#
# WHY THE PROXY IS THE WHOLE POINT. The relay is reachable at `http://relay:3000` only from
# inside the compose network. A browser cannot resolve `relay`, so a page that fetched it
# directly would fail with ERR_NAME_NOT_RESOLVED on the operator's machine. The app already
# calls the relay through the same-origin prefix `/api/v1/...` and expects an edge to strip
# it, so this is that edge: the browser talks to this server only, and the compose hostname
# never leaves the container.
#
# The trailing slash on proxy_pass is what performs the strip:
#   /api/v1/tokens  ->  http://relay:3000/tokens
# Removing it would forward /api/v1/tokens verbatim and every call would 404.
#
# `relay` is resolved ONCE, when nginx loads this file. That is why compose makes this
# service wait for the relay to be healthy: without the wait, a cold start races DNS and
# nginx exits with "host not found in upstream".

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # An intent payload carries a proven, serialised transaction, which is far larger than
    # nginx's 1m default. A rejected POST would surface in the browser as a bare 413 with no
    # hint that a proxy, not the relay, refused it.
    client_max_body_size 32m;

    # ── the relay's public API ───────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://relay:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Quoting and job submission both wait on a solver that is building and proving a
        # real transaction. The 60s default cuts that off mid-proof and the UI reports a
        # failed swap for a swap that is still succeeding.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Streamed straight through: a buffered proxy holds a slow response until it
        # completes, which turns progress into a stall.
        proxy_buffering off;
    }

    # ── static assets ────────────────────────────────────────────────────────
    # vite content-hashes these names, so they are safe to cache hard.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the SPA's entry point AND carries the injected runtime configuration, so
    # a cached copy would pin a browser to a previous deployment's settings.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
