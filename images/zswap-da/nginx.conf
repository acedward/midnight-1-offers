# The zswap-da SPA, served on container :10600 (compose publishes it on
# ${FRONTEND_HOST_PORT}).
#
# There is deliberately no `types { … }` block here. The stock /etc/nginx/mime.types already
# maps application/wasm, and a second `types` block in the same context is a configuration
# error rather than a merge — the Dockerfile asserts the mapping exists instead, so a base
# image that ever dropped it fails the BUILD rather than serving wasm as octet-stream and
# breaking streaming instantiation at run time.
server {
    listen 10600;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /config.js is written at container start and must never be cached: it carries the host
    # endpoints, which change with the port block. A stale copy sends the browser at the
    # previous stack's ports, which looks exactly like a dead backend.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback: client-side routes resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
