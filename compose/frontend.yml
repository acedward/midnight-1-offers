# compose/frontend.yml — the `frontend` profile: the zswap-da trading SPA.
#
#   ./up.sh --with offerfiles --with frontend
#
# A profile IS this file's basename; no compose `profiles:` key is used here.
#
# `--with frontend` alone is legal and has NO cross-fragment depends_on, deliberately: the SPA
# is static nginx, it serves and shows a disconnected state, exactly as in midnight-2-offers.
# It needs `--with offerfiles` to have a kernel to talk to, but it must neither drag the
# kernel in nor fail without it.
#
# WHAT THE BROWSER HAS TO REACH, and why this fragment cares. The page runs on the operator's
# machine, not on the compose network. It talks to four things directly — the kernel API, the
# batcher, the indexer (HTTP + WS) and the proof server — and the kernel's own
# GET /v1/midnight/config reports the last two as `indexer:8088` / `proof-server:6300`, which
# resolve nowhere in a browser. Upstream's api.ts chokepoint (effectstream#912, on the pinned
# midnight-1 tree) rewrites them, and the FRONTEND_*_URI variables below are what make that
# rewrite correct on a NON-DEFAULT port block: the fallback rewrite keeps the container port,
# which only the default block publishes unchanged. scripts/pick-ports.sh emits all six.

services:
  # Built in-image from effectstream/effectstream at ${FRONTEND_REF}, subtree
  # templates/zswap-da, with the subtree SHA verified during the build. No frontend source and
  # no generated contract output is stored in this repository, so a cold build needs GitHub +
  # npm network access. See images/zswap-da/PROVENANCE.md.
  #
  # UNPATCHED FOR LEDGER, unlike the 2.x sibling: the template is v8-native at this ref
  # (ledger-v8 8.1.0, midnight-js 4.1.1), which the build asserts in both directions rather
  # than assuming.
  #
  # AND IT COMPILES NOTHING since `FRONTEND_REF=400880ce…` (00020 PR D). effectstream #922 —
  # the frontend half of kernel #69 — deleted the template's Compact source, its build script,
  # its committed manifest and its Faucet SCREEN. There is no `COMPACT_VERSION` build arg here
  # any more and no `compact` entry in config/artifact-decisions.json; the image asserts the
  # absence instead, so a ref moved backwards fails the build.
  frontend:
    image: '${FRONTEND_IMAGE:-midnight-1-offers/zswap-da:local}'
    build:
      context: '../images/zswap-da'
      args:
        FRONTEND_REPO: '${FRONTEND_REPO:-https://github.com/effectstream/effectstream.git}'
        # effectstream `midnight-1` head — the branch maintained for the 1.x line (Q14).
        FRONTEND_REF: '${FRONTEND_REF:-400880ceb6814738d1ae193dae18ad5128922edc}'
        # The commit says WHICH history; the subtree SHA says which BYTES of it were
        # extracted. scripts/verify-compose-pins.sh binds both to config/artifact-decisions.json.
        FRONTEND_SUBTREE_SHA: '${FRONTEND_SUBTREE_SHA:-a750cccd653f33306d3ff7249fe8d5853fbfafa6}'
        # ── the two values #920 made build-time (00020 Q4) ───────────────────
        #
        # src/config.ts reads BOTH from `import.meta.env` and offers NO `window.*` override
        # for either, so neither can be moved into /config.js the way the six endpoint URLs
        # are. They are baked, and this image is built per stack anyway (FRONTEND_IMAGE
        # carries the run's tag).
        #
        # DELIBERATELY NOT OVERRIDABLE from the environment, like COMPACT_VERSION was: this
        # repository is a local `undeployed` devnet in every other pin it makes, and #920
        # flipped the template's own default to `preprod`. An env typo here would put the SPA
        # on the wrong network for address formatting, offer parsing, the Lace handshake and
        # the built-in JS wallet at once. The image refuses any other value.
        FRONTEND_NETWORK_ID: 'undeployed'
        # This stack's OWN faucet site — the `issuer` profile's nginx on ${FAUCET_HOST_PORT}
        # (compose/issuer.yml), NOT the public mint-test-tokens site the template defaults to.
        # scripts/pick-ports.sh emits this for every generated stack and scripts/lib/common.sh
        # defaults it from the FAUCET_URL it already computes; the default below is the
        # default port block's, matching FAUCET_HOST_PORT=10500.
        #
        # The `?network=undeployed` is DOCUMENTATION: src/faucetUrl.ts overwrites the
        # parameter from FRONTEND_NETWORK_ID above. It is carried so the baked string is
        # byte-identical to the URL `up.sh` prints, which is what lets
        # scripts/verify-frontend.sh assert it out of the served bundle as an EXACT match.
        FRONTEND_FAUCET_URL: '${FRONTEND_FAUCET_URL:-http://127.0.0.1:10500/?network=undeployed}'
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${FRONTEND_HOST_PORT:-10600}:10600'
    environment:
      # ALL SIX ARE EMPTY BY DEFAULT, and empty means "use the template's own fallbacks":
      # http://<pageHost>:9999 and :3334 for the API and batcher, and the hostname-only
      # rewrite for whatever GET /v1/midnight/config reported. That is exactly right on the
      # default port block and wrong on any other, which is why every generated stack
      # (scripts/pick-ports.sh, scripts/ci-check.sh) sets them.
      #
      # The entrypoint SKIPS an empty value rather than writing `window.X = ""` — an empty
      # string would satisfy the template's `??` and defeat the fallback it is meant to keep.
      API_BASE: '${FRONTEND_API_BASE:-}'
      BATCHER_URL: '${FRONTEND_BATCHER_URL:-}'
      # Overrides folded into GET /v1/midnight/config by upstream's api.getMidnightConfig (#912).
      # NODE_URI has no counterpart in that response at all: the kernel never reports one, and
      # without this the in-page JS wallet falls back to http://<pageHost>:9944.
      NODE_URI: '${FRONTEND_NODE_URI:-}'
      INDEXER_URI: '${FRONTEND_INDEXER_URI:-}'
      INDEXER_WS_URI: '${FRONTEND_INDEXER_WS_URI:-}'
      PROOF_SERVER_URI: '${FRONTEND_PROOF_SERVER_URI:-}'
    healthcheck:
      # BOTH paths, because they prove different things. `/` proves nginx is up and dist/ was
      # copied; `/config.js` proves the ENTRYPOINT ran — it is not in the image, it is written
      # at container start, and `location = /config.js` has no SPA fallback, so a missing file
      # is a real 404 rather than a 200 of index.html. A container that served the shell with
      # no runtime config would otherwise look healthy and fail in the browser.
      test:
        - 'CMD-SHELL'
        - 'wget -qO/dev/null http://127.0.0.1:10600/ && wget -qO/dev/null http://127.0.0.1:10600/config.js'
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: 'unless-stopped'
